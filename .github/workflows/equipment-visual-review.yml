name: Equipment Visual Review
on:
  push:
    paths:
      - '.github/workflows/equipment-visual-review.yml'
      - '.github/scripts/equipment-visual-review.mjs'
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local game
        run: |
          python3 -m http.server 4173 > /tmp/ganjarium-server.log 2>&1 &
      - name: Capture real game variants
        run: node .github/scripts/equipment-visual-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-visual-review
          path: review-output/
          retention-days: 1
