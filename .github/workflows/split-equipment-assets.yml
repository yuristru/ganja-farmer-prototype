name: Build equipment assets

on:
  push:
    paths:
      - "assets/equipment/_build/**"
      - ".github/workflows/split-equipment-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Rebuild high resolution master sprite
        run: |
          cat assets/equipment/_build/chunk_00.b64               assets/equipment/_build/chunk_01.b64               assets/equipment/_build/chunk_02.b64               assets/equipment/_build/chunk_03.b64               assets/equipment/_build/chunk_04.b64               assets/equipment/_build/chunk_05.b64               assets/equipment/_build/chunk_06.b64               assets/equipment/_build/chunk_07.b64               | tr -d '\n\r '               | base64 -d > assets/equipment/equipment_master_v57.png
          identify assets/equipment/equipment_master_v57.png

      - name: Split master sprite into category strips
        run: |
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+0 +repage assets/equipment/light.png
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+256 +repage assets/equipment/vent.png
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+512 +repage assets/equipment/irrigation.png
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+768 +repage assets/equipment/nutrients.png
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+1024 +repage assets/equipment/sensor.png
          convert assets/equipment/equipment_master_v57.png -crop 2560x256+0+1280 +repage assets/equipment/substrate.png
          identify assets/equipment/light.png assets/equipment/vent.png assets/equipment/irrigation.png assets/equipment/nutrients.png assets/equipment/sensor.png assets/equipment/substrate.png

      - name: Commit generated equipment files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf assets/equipment/_build
          rm -f assets/equipment/equipment_master_v57.png
          git add -A assets/equipment
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "V57 rebuild high resolution equipment sprites"
            git push
          fi
