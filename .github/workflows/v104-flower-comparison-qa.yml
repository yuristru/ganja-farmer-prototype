name: V104 Flower Comparison QA
on:
  push:
    paths:
      - 'index.html'
      - 'assets/cultivars.js'
      - 'assets/flower-art.js'
      - 'assets/flowers/**'
      - 'tests/v104-flower-comparison-qa.mjs'
      - '.github/workflows/v104-flower-comparison-qa.yml'
  workflow_dispatch:
jobs:
  flower-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check 100 variants and comparison page
        run: node tests/v104-flower-comparison-qa.mjs
      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v104-flower-comparison
          path: qa/v104/
