name: V105 Upgrade Store QA
on:
  push:
    paths:
      - 'index.html'
      - 'assets/equipment/**'
      - 'assets/equipment3d.js'
      - 'assets/store-equipment.js'
      - 'assets/flower-art.js'
      - 'assets/flowers/**'
      - 'tests/v105-upgrade-store-qa.mjs'
      - '.github/workflows/v105-upgrade-store-qa.yml'
  workflow_dispatch:
jobs:
  upgrade-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check all 60 upgrade tiers and image fit
        run: node tests/v105-upgrade-store-qa.mjs
      - name: Upload visual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v105-upgrade-store
          path: qa/v105/
