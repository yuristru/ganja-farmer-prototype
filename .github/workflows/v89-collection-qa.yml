name: V89 Collection QA

on:
  push:
    paths:
      - 'index.html'
      - 'tests/v89-collection-qa.mjs'
      - '.github/workflows/v89-collection-qa.yml'
  workflow_dispatch:

jobs:
  collection-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run V89 collection QA
        run: node tests/v89-collection-qa.mjs
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v89-collection-qa
          path: qa/v89/
          if-no-files-found: warn
