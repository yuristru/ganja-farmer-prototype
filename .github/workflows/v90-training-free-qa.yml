name: V90 Free Training QA

on:
  push:
    paths:
      - 'index.html'
      - 'tests/v90-training-free-qa.mjs'
      - '.github/workflows/v90-training-free-qa.yml'
  workflow_dispatch:

jobs:
  free-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run V90 free training QA
        run: node tests/v90-training-free-qa.mjs
      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v90-training-free-qa
          path: qa/v90-training-free/
          if-no-files-found: warn
