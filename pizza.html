function clear(){ticks=[];world.removeChildren().forEach(x=>x.destroy({children:true}));ui.removeChildren().forEach(x=>x.destroy({children:true}))}
function text(s,x,y,n=7,col='#f5e8c8',ax=0,ay=0){const t=new Text({text:s,style:{fontFamily:'monospace',fontSize:n,fill:col,fontWeight:'700'}});t.x=x|0;t.y=y|0;t.anchor.set(ax,ay);return t}

function iso(x,y,ox=0,oy=0){return{x:ox+(x-y)*TW/2,y:oy+(x+y)*TH/2}}

function hash(x,y,s=1){let n=(x*374761393+y*668265263+s*1442695041)>>>0;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967295}
function building(gx,gy,bx,by,special=false){const r=hash(bx,by,91),pal=[{t:0x9c7353,l:0x7c523f,r:0x604039},{t:0xa18e66,l:0x7c6b50,r:0x5b5141},{t:0x74837c,l:0x586a64,r:0x445650},{t:0x986158,l:0x744843,r:0x5c3936}],p=special?{t:0xc75c3d,l:0x934031,r:0x713025}:pal[(r*pal.length)|0],h=special?31:23+(r*18|0),c=new Container();c.addChild(prism(gx,gy,2.65,2.65,h,p));const mid=iso(gx+1.3,gy+1.3),win=new Graphics();for(let f=0;f<Math.max(1,h/10|0);f++){win.rect(mid.x+8,mid.y-h+7+f*9,5,3).fill(0xd2c27f);win.rect(mid.x-13,mid.y-h+10+f*9,5,3).fill(0x87aaa2)}c.addChild(win);if(special){const sg=new Graphics();sg.rect(mid.x-18,mid.y-h-14,36,10).fill(0x351516).stroke({color:C.gold,width:1});c.addChild(sg,text('MAMMA MIA',mid.x,mid.y-h-9,5,'#ffe17a',.5,.5));const aw=new Graphics();aw.rect(mid.x+8,mid.y-18,21,5).fill(0xecd398);for(let i=0;i<3;i++)aw.rect(mid.x+8+i*8,mid.y-18,4,5).fill(C.red);c.addChild(aw)}c.zIndex=mid.y+100;return c}

function city(){clear();head('ROM','SA 16:42  ·  23°C');const m=new Container();m.sortableChildren=true;m.scale.set(.88);m.x=W/2;m.y=92;world.addChild(m);const N=20;
for(let s=0;s<38;s++)for(let x=0;x<N;x++){const y=s-x;if(y<0||y>=N)continue;const p=iso(x,y),road=x%4===0||y%4===0,edge=!road&&(x%4===1||x%4===3||y%4===1||y%4===3),d=diamond(p.x,p.y,road?((x+y)&1?C.road:C.road2):edge?C.walk:C.grass,road?0x343339:0x4b503d);d.zIndex=p.y;m.addChild(d);if(road&&(x+y)%3===0){const q=new Graphics();q.rect(p.x-2,p.y,4,1).fill(0xb3a57b);q.zIndex=p.y+2;m.addChild(q)}}
for(let bx=0;bx<5;bx++)for(let by=0;by<5;by++){const gx=bx*4+1.18,gy=by*4+1.18,special=bx===2&&by===2,r=hash(bx,by,1701);if(!special&&r<.18){m.addChild(tree(gx+.6,gy+.7),tree(gx+1.8,gy+1.8))}else{m.addChild(building(gx,gy,bx,by,special));if(special){const p=iso(gx+1.35,gy+1.35),h=new Graphics();h.rect(p.x-27,p.y-52,54,56).fill({color:0xffffff,alpha:.001});h.eventMode='static';h.cursor='pointer';h.zIndex=p.y+500;h.on('pointertap',restaurant);m.addChild(h)}}}
const cars=[],cols=[0xc5523c,0x4f7793,0xd0a243,0x75905d,0xb3a698];for(let i=0;i<10;i++){const axis=i%2,g=car(cols[i%5],axis);m.addChild(g);cars.push({g,axis,lane:[0,4,8,12,16][i%5]+(i%2?.16:-.16),t:(i*2.1+1)%19.5,dir:i%3?-1:1,spd:.42+(i%3)*.08})}

const R={cols:8,rows:8,ox:W/2,oy:86},defs={table:[2,2],chair:[1,1],oven:[2,1],arcade:[1,1]};function dims(o,r=rot){const t=typeof o==='string'?o:o.type,rr=typeof o==='string'?r:o.rot,[w,h]=defs[t];return rr%2?{w:h,h:w}:{w,h}}function cells(o){const d=dims(o),a=[];for(let x=0;x<d.w;x++)for(let y=0;y<d.h;y++)a.push(`${o.x+x},${o.y+y}`);return a}function occupied(){return new Set(furniture.flatMap(cells))}function can(type,x,y,r){const o={type,x,y,rot:r},d=dims(o),set=occupied();return x>=0&&y>=0&&x+d.w<=R.cols&&y+d.h<=R.rows&&cells(o).every(k=>!set.has(k))}

function restaurant(){clear();head('MAMMA MIA','EINRICHTEN  ·  TAP ZUM PLATZIEREN');const r=new Container();r.sortableChildren=true;world.addChild(r);const a=iso(0,0,R.ox,R.oy),b=iso(8,0,R.ox,R.oy),d=iso(0,8,R.ox,R.oy),w=new Graphics();w.poly([a.x,a.y,b.x,b.y,b.x,b.y-42,a.x,a.y-42]).fill(0x816b52);w.poly([a.x,a.y,d.x,d.y,d.x,d.y-42,a.x,a.y-42]).fill(0x655546);r.addChild(w);const deco=new Graphics();deco.rect(128,50,19,15).fill(0x5f7f86).stroke({color:0xd3b97b,width:1});deco.rect(70,50,17,14).fill(0x4b6a72).stroke({color:0xcaaa70,width:1});r.addChild(deco,text('PIZZERIA',107,58,6,'#f1cf6d',.5,.5));for(let s=0;s<15;s++)for(let x=0;x<8;x++){const y=s-x;if(y<0||y>=8)continue;const p=iso(x+.5,y+.5,R.ox,R.oy),g=diamond(p.x,p.y,(x+y)&1?0xb98d56:0xc9a166,0x7a5a3d);g.eventMode='static';g.cursor='pointer';g.zIndex=p.y+5;g.on('pointertap',()=>{if(tool==='delete'){const i=furniture.findIndex(o=>cells(o).includes(`${x},${y}`));if(i>=0)furniture.splice(i,1);restaurant()}else if(can(tool,x,y,rot)){furniture.push({type:tool,x,y,rot});restaurant()}});r.addChild(g)}furniture.forEach(o=>r.addChild(furn(o)));
