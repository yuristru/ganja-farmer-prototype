<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171416">
<title>Pizza City Asset Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171416;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff2d5}
#app{position:fixed;inset:0;overflow:hidden;background:#171416}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;z-index:20;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));height:64px;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(37,28,27,.96);border:2px solid #76564a;box-shadow:0 3px 0 #0b090a}
.title{font-weight:900;font-size:17px;letter-spacing:.04em}
.sub{font-size:10px;margin-top:4px;color:#c6b49b;font-weight:800}
.money{font:900 15px ui-monospace,SFMono-Regular,Menlo,monospace;color:#e3b653}
.hint{position:absolute;z-index:18;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 73px);transform:translateX(-50%);padding:6px 8px;background:rgba(24,18,20,.78);border:1px solid #5d4640;font-size:9px;font-weight:800;color:#d1c0a8;white-space:nowrap;pointer-events:none}
.card{position:absolute;z-index:20;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(37,28,27,.97);border:2px solid #76564a;box-shadow:0 4px 0 #0b090a;padding:9px}
.citybar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#e3b653;font-weight:900}
.info{font-size:11px;color:#c6b49b;margin-top:4px;line-height:1.35}
button{appearance:none;border:2px solid #8a674f;background:#382b29;color:#fff0d0;min-height:42px;padding:0 12px;font-weight:900;font-size:11px;text-transform:uppercase;border-radius:2px;box-shadow:0 2px 0 #120d0e}
button.primary,button.active{background:#d49a3c;border-color:#f1cc72;color:#221915}
button:active{transform:translateY(1px)}
#restaurantTools{display:none}
.toolshead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools button{padding:0 3px}
.tools2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.badge{display:inline-block;padding:3px 5px;background:#4b392f;color:#e8cfaa;border:1px solid #795e4d;font-size:9px;font-weight:800}
#loading{position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:#171416;color:#e6c882;font-weight:900;font-size:12px;letter-spacing:.08em}
.credit{position:absolute;z-index:17;right:12px;bottom:96px;font-size:8px;color:rgba(255,242,213,.45);pointer-events:none}
@media(min-width:700px){#app{width:430px;height:932px;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 20px 80px #000}.hud{top:10px}.card{bottom:10px}.hint{top:83px}}
</style>
</head>
<body>
<div id="app">
  <div id="loading">LADE PIXEL-ASSETS ...</div>
  <div class="hud">
    <div><div id="hudTitle" class="title">PIZZA CITY</div><div id="hudSub" class="sub">ROM · SA · 16:42</div></div>
    <div class="money">€ 18.420</div>
  </div>
  <div id="hint" class="hint">Ziehen: Stadt bewegen · Pizzeria antippen</div>
  <div id="cityTools" class="card citybar">
    <div><div class="eyebrow">Mamma Mia <span class="badge">DEMO</span></div><div class="info">Pixel-Stadt aus freien CC0-Assets · Innenstadt</div></div>
    <button id="enterBtn" class="primary">Betreten</button>
  </div>
  <div id="restaurantTools" class="card">
    <div class="toolshead">
      <div><div class="eyebrow">Einrichtung</div><div id="toolInfo" class="info">Tisch ausgewählt</div></div>
      <button id="cityBtn">← Stadt</button>
    </div>
    <div class="tools">
      <button data-tool="table" class="active">Tisch</button>
      <button data-tool="chair">Stuhl</button>
      <button data-tool="oven">Ofen</button>
      <button data-tool="arcade">Automat</button>
    </div>
    <div class="tools2">
      <button id="rotateBtn">Drehen</button>
      <button data-tool="delete">Löschen</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
  <div id="credit" class="credit">City art: pixel32 · CC0</div>
</div>

<script type="module">
import {Application,Container,Graphics,Sprite,Texture,Text,Rectangle,Assets} from 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';

const root=document.querySelector('#app');
const app=new Application();
await app.init({
  resizeTo:root,
  background:'#171416',
  antialias:false,
  autoDensity:true,
  resolution:Math.min(window.devicePixelRatio||1,2),
  preference:'webgl'
});
root.prepend(app.canvas);
app.stage.eventMode='static';

const world=new Container();
world.sortableChildren=true;
app.stage.addChild(world);

const hudTitle=document.querySelector('#hudTitle');
const hudSub=document.querySelector('#hudSub');
const hint=document.querySelector('#hint');
const cityTools=document.querySelector('#cityTools');
const restaurantTools=document.querySelector('#restaurantTools');
const toolInfo=document.querySelector('#toolInfo');
const loading=document.querySelector('#loading');
const credit=document.querySelector('#credit');

const TW=64,TH=32,CITY_N=21,ROAD_EVERY=5,SEED=82731;
const ASSET_BASE='https://raw.githubusercontent.com/matehackers/simate/master/data/';
const ASSET_URLS={
  small:ASSET_BASE+'city_small.png',
  medium:ASSET_BASE+'city_medium.png',
  big:ASSET_BASE+'city_big.png'
};

let scene='city',selectedTool='table',rotation=0,camera=null,movers=[];
let assetTex={};
let restaurantState=[
  {type:'oven',x:1,y:1,r:0},
  {type:'table',x:4,y:4,r:0},
  {type:'chair',x:3,y:4,r:0},
  {type:'chair',x:6,y:4,r:2}
];

function iso(x,y,ox=0,oy=0){return{x:ox+(x-y)*TW/2,y:oy+(x+y)*TH/2}}
function hash(x,y,s=SEED){let n=(x*374761393+y*668265263+s*69069)>>>0;n=(n^(n>>13))*1274126177;return((n^(n>>16))>>>0)/4294967295}
function diamond(cx,cy,fill,stroke=0){const g=new Graphics();const p=[cx,cy-TH/2,cx+TW/2,cy,cx,cy+TH/2,cx-TW/2,cy];g.poly(p).fill(fill);if(stroke)g.poly(p).stroke({color:stroke,width:1});return g}
function textLabel(s,size=11,color='#fff1cf'){return new Text({text:s,style:{fontFamily:'monospace',fontSize:size,fill:color,fontWeight:'900'}})}
function clearWorld(){movers=[];world.removeChildren().forEach(c=>c.destroy({children:true}))}

async function loadAssets(){
  try{
    const [small,medium,big]=await Promise.all([
      Assets.load(ASSET_URLS.small),
      Assets.load(ASSET_URLS.medium),
      Assets.load(ASSET_URLS.big)
    ]);
    [small,medium,big].forEach(t=>t.source.scaleMode='nearest');
    assetTex={small,medium,big};
  }catch(err){
    console.warn('External city assets failed, using fallback.',err);
    assetTex={
      small:makeFallbackBuilding(0xc88661,0x7d433c,52),
      medium:makeFallbackBuilding(0xd0a16d,0x554b45,68),
      big:makeFallbackBuilding(0xa49b7d,0x4b5559,86)
    };
  }
  loading.style.display='none';
}

function makeFallbackBuilding(wall,roof,h){
  const c=document.createElement('canvas');c.width=64;c.height=96;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
  x.fillStyle='#0005';x.fillRect(15,87,38,4);
  x.fillStyle='#8d614b';x.beginPath();x.moveTo(8,30);x.lineTo(32,43);x.lineTo(32,86);x.lineTo(8,73);x.fill();
  x.fillStyle=`#${wall.toString(16)}`;x.beginPath();x.moveTo(32,43);x.lineTo(56,30);x.lineTo(56,73);x.lineTo(32,86);x.fill();
  x.fillStyle=`#${roof.toString(16)}`;x.beginPath();x.moveTo(6,28);x.lineTo(32,12);x.lineTo(58,28);x.lineTo(32,43);x.fill();
  for(let yy=47;yy<78;yy+=12){x.fillStyle='#d8c48f';x.fillRect(14,yy,7,7);x.fillRect(40,yy,7,7);x.fillStyle='#688991';x.fillRect(15,yy+1,5,5);x.fillRect(41,yy+1,5,5)}
  const t=Texture.from(c);t.source.scaleMode='nearest';return t
}

function isRoad(x,y){return x%ROAD_EVERY===0||y%ROAD_EVERY===0}
function roadTileColor(x,y){return (x+y)%2?0x51545b:0x4b4d54}

function makeTree(){
  const g=new Container(),s=new Graphics();
  s.ellipse(0,3,13,5).fill({color:0x000000,alpha:.18});
  s.rect(-2,-20,4,22).fill(0x68452f);
  s.rect(-10,-34,20,17).fill(0x4f784a);
  s.rect(-7,-42,14,15).fill(0x648d55);
  s.rect(-12,-28,9,10).fill(0x5c8550);
  g.addChild(s);return g
}
function makePerson(i){
  const g=new Graphics(),cols=[0xbc5542,0x527fa0,0x6d8e57,0xd3a54a,0x8b6285];
  g.ellipse(0,1,5,2).fill({color:0,alpha:.22});
  g.rect(-2,-11,4,8).fill(cols[i%cols.length]);g.rect(-1,-14,3,3).fill(0xd19a72);return g
}
function makeCar(i){
  const cols=[0xc34d3c,0x4c78a5,0xcaa33d,0x658a60,0xe1d1b4];
  const g=new Graphics();g.rect(-10,-4,20,8).fill(cols[i%cols.length]);g.rect(-4,-8,10,5).fill(0x829fa5);g.rect(-7,4,4,2).fill(0x222228);g.rect(4,4,4,2).fill(0x222228);return g
}

function addBuilding(layer,x,y,type,pizza=false){
  const p=iso(x,y);
  const tex=assetTex[type];
  const s=new Sprite(tex);
  s.anchor.set(.5,.88);
  const scale=type==='big'?.76:type==='medium'?.68:.62;
  s.scale.set(scale);
  s.x=p.x;s.y=p.y+3;s.zIndex=p.y+100;
  if(pizza){
    s.eventMode='static';s.cursor='pointer';s.on('pointertap',showRestaurant);
    const tag=new Container();tag.x=p.x;tag.y=p.y-76;tag.zIndex=p.y+400;
    const bg=new Graphics();bg.roundRect(-46,-13,92,26,4).fill(0x2b1f1e).stroke({color:0xe0b253,width:2});
    const tx=textLabel('🍕 MAMMA MIA',10,'#ffe1a0');tx.anchor.set(.5);tag.addChild(bg,tx);
    layer.addChild(tag);
  }else{
    const r=hash(x,y,9911);
    s.tint=r>.85?0xe6d8c6:r>.68?0xffe6c2:0xffffff;
  }
  layer.addChild(s);
}
function addPark(layer,x,y){
  const p=iso(x,y);const ground=diamond(p.x,p.y,0x638059,0x4f6848);ground.zIndex=p.y;layer.addChild(ground);
  if(hash(x,y,771)>.35){const t=makeTree();t.x=p.x;t.y=p.y;t.zIndex=p.y+80;layer.addChild(t)}
}

function showCity(){
  scene='city';clearWorld();
  hudTitle.textContent='PIZZA CITY';hudSub.textContent='ROM · SA · 16:42';
  cityTools.style.display='grid';restaurantTools.style.display='none';credit.style.display='block';
  hint.textContent='Ziehen: Stadt bewegen · Pizzeria antippen';

  camera=new Container();camera.sortableChildren=true;world.addChild(camera);
  const map=new Container();map.sortableChildren=true;camera.addChild(map);
  let pizzaPos={x:9,y:8};

  for(let s=0;s<CITY_N*2;s++){
    for(let x=0;x<CITY_N;x++){
      const y=s-x;if(y<0||y>=CITY_N)continue;
      const p=iso(x,y);
      if(isRoad(x,y)){
        const d=diamond(p.x,p.y,roadTileColor(x,y),0x3e4147);d.zIndex=p.y;map.addChild(d);
        if((x+y)%2===0){const m=new Graphics();m.rect(p.x-5,p.y-1,10,2).fill(0xb5ad8e);m.zIndex=p.y+2;map.addChild(m)}
      }else{
        const r=hash(x,y,444);
        const base=diamond(p.x,p.y,r<.16?0x647d59:0x9a8d69,0x6f674f);base.zIndex=p.y;map.addChild(base);
        if(r<.16){addPark(map,x,y);continue}
        if(x===pizzaPos.x&&y===pizzaPos.y){addBuilding(map,x,y,'medium',true);continue}
        if((x+y)%3!==0||hash(x,y,812)>.35){
          const br=hash(x,y,661);
          const type=br>.78?'big':br>.38?'medium':'small';
          addBuilding(map,x,y,type,false);
        }else{
          const t=makeTree();t.x=p.x;t.y=p.y;t.zIndex=p.y+80;map.addChild(t)
        }
      }
    }
  }

  for(let i=0;i<12;i++){
    const c=makeCar(i);c.zIndex=900;map.addChild(c);
    movers.push({kind:'car',g:c,axis:i%2,lane:[0,5,10,15,20][i%5],t:(i*1.73)%CITY_N,dir:i%3?1:-1,speed:.55+(i%4)*.09})
  }
  for(let i=0;i<30;i++){
    const p=makePerson(i);p.zIndex=950;map.addChild(p);
    movers.push({kind:'person',g:p,axis:i%2,lane:[0,5,10,15,20][(i+2)%5],t:(i*.67)%CITY_N,dir:i%4<2?1:-1,speed:.11+(i%5)*.015,offset:(i%2?0.33:-0.33)})
  }

  const center=iso(pizzaPos.x,pizzaPos.y);
  camera.x=Math.round(app.screen.width/2-center.x);
  camera.y=Math.round(app.screen.height*.47-center.y);

  let dragging=false,last=null;
  app.stage.removeAllListeners();
  app.stage.eventMode='static';app.stage.hitArea=new Rectangle(0,0,app.screen.width,app.screen.height);
  app.stage.on('pointerdown',e=>{dragging=true;last={x:e.global.x,y:e.global.y}});
  app.stage.on('pointermove',e=>{
    if(!dragging||!last)return;
    const dx=e.global.x-last.x,dy=e.global.y-last.y;
    camera.x+=dx;camera.y+=dy;last={x:e.global.x,y:e.global.y};
  });
  app.stage.on('pointerup',()=>{dragging=false;last=null});
  app.stage.on('pointerupoutside',()=>{dragging=false;last=null});
}

function restaurantIso(x,y){return{x:app.screen.width/2+(x-y)*34,y:165+(x+y)*17}}
const ROOM={w:8,h:8};

function itemCells(it){
  const d=it.type==='table'?{w:2,h:2}:it.type==='oven'?((it.r%2)?{w:1,h:2}:{w:2,h:1}):{w:1,h:1};
  const out=[];for(let dx=0;dx<d.w;dx++)for(let dy=0;dy<d.h;dy++)out.push(`${it.x+dx},${it.y+dy}`);return out
}
function canPlace(type,x,y,r){
  const temp={type,x,y,r};const cells=itemCells(temp);
  if(cells.some(v=>{const[a,b]=v.split(',').map(Number);return a<0||b<0||a>=ROOM.w||b>=ROOM.h}))return false;
  const used=new Set(restaurantState.flatMap(itemCells));return cells.every(c=>!used.has(c))
}
function drawFurniture(layer,it){
  const p=restaurantIso(it.x,it.y),g=new Container();g.zIndex=p.y+120;
  if(it.type==='table'){
    const q=diamond(p.x+17,p.y+4,0xb57846,0x70442f);q.scale.set(1.25,.9);g.addChild(q);
    const legs=new Graphics();legs.rect(p.x+2,p.y+4,4,15).fill(0x62402d);legs.rect(p.x+29,p.y+4,4,15).fill(0x62402d);g.addChild(legs)
  }else if(it.type==='chair'){
    const q=new Graphics();q.rect(p.x-7,p.y-14,14,8).fill(0x8b593b);q.rect(p.x-7,p.y-25,4,13).fill(0x65412e);q.rect(p.x+3,p.y-25,4,13).fill(0x65412e);g.addChild(q)
  }else if(it.type==='oven'){
    const q=new Graphics();q.rect(p.x-15,p.y-39,35,38).fill(0x74736d);q.rect(p.x-11,p.y-26,27,17).fill(0x343335);q.rect(p.x-7,p.y-22,19,9).fill(0xcc5d35);g.addChild(q)
  }else{
    const q=new Graphics();q.rect(p.x-10,p.y-42,21,41).fill(0x6e4258);q.rect(p.x-6,p.y-33,13,10).fill(0x3e8f98);g.addChild(q)
  }
  layer.addChild(g)
}

function showRestaurant(){
  scene='restaurant';clearWorld();
  hudTitle.textContent='MAMMA MIA';hudSub.textContent='EINRICHTUNG · DEMO';
  cityTools.style.display='none';restaurantTools.style.display='block';credit.style.display='none';
  hint.textContent='Objekt wählen · Bodenfeld antippen';
  app.stage.removeAllListeners();

  const layer=new Container();layer.sortableChildren=true;world.addChild(layer);
  const wall=new Graphics();
  const a=restaurantIso(0,0),b=restaurantIso(ROOM.w-1,0),c=restaurantIso(0,ROOM.h-1);
  wall.poly([a.x,a.y-8,b.x,b.y-8,b.x,b.y-78,a.x,a.y-78]).fill(0x8a7259);
  wall.poly([a.x,a.y-8,c.x,c.y-8,c.x,c.y-78,a.x,a.y-78]).fill(0x705e4c);
  layer.addChild(wall);

  for(let s=0;s<ROOM.w+ROOM.h;s++){
    for(let x=0;x<ROOM.w;x++){
      const y=s-x;if(y<0||y>=ROOM.h)continue;
      const p=restaurantIso(x,y);
      const t=new Graphics();t.poly([p.x,p.y-17,p.x+34,p.y,p.x,p.y+17,p.x-34,p.y]).fill((x+y)%2?0xbf975b:0xcba568).stroke({color:0x816443,width:1});
      t.eventMode='static';t.cursor='pointer';t.on('pointertap',()=>{
        if(selectedTool==='delete'){
          const idx=restaurantState.findIndex(it=>itemCells(it).includes(`${x},${y}`));
          if(idx>=0)restaurantState.splice(idx,1);showRestaurant();return
        }
        if(canPlace(selectedTool,x,y,rotation)){restaurantState.push({type:selectedTool,x,y,r:rotation});showRestaurant()}
      });
      layer.addChild(t)
    }
  }

  restaurantState.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(it=>drawFurniture(layer,it));
  for(let i=0;i<4;i++){
    const p=makePerson(i);const pos=restaurantIso(2+i,6-(i%2)*2);p.x=pos.x;p.y=pos.y;p.zIndex=pos.y+300;layer.addChild(p)
  }
}

app.ticker.add(t=>{
  if(scene!=='city')return;
  const dt=t.deltaTime;
  for(const m of movers){
    m.t+=m.speed*dt*.035*m.dir;
    if(m.t>CITY_N-.1)m.t=.1;if(m.t<.1)m.t=CITY_N-.1;
    const x=m.axis===0?m.t:m.lane+(m.offset||0),y=m.axis===0?m.lane+(m.offset||0):m.t;
    const p=iso(x,y);
    m.g.x=Math.round(p.x);m.g.y=Math.round(p.y-(m.kind==='car'?4:0));m.g.zIndex=p.y+500
  }
});

document.querySelector('#enterBtn').onclick=showRestaurant;
document.querySelector('#cityBtn').onclick=showCity;
document.querySelector('#rotateBtn').onclick=()=>{rotation=(rotation+1)%4;toolInfo.textContent=`${selectedTool.toUpperCase()} · ${rotation*90}°`};
document.querySelector('#resetBtn').onclick=()=>{restaurantState=[{type:'oven',x:1,y:1,r:0},{type:'table',x:4,y:4,r:0},{type:'chair',x:3,y:4,r:0},{type:'chair',x:6,y:4,r:2}];showRestaurant()};
document.querySelectorAll('[data-tool]').forEach(btn=>btn.onclick=()=>{
  selectedTool=btn.dataset.tool;
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b===btn));
  toolInfo.textContent=selectedTool==='delete'?'Objekt zum Löschen antippen':`${selectedTool.toUpperCase()} ausgewählt`;
});

window.addEventListener('resize',()=>{if(scene==='city')showCity();else showRestaurant()});
await loadAssets();
showCity();
</script>
</body>
</html>
