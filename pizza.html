<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#17151a" />
<title>Pizza City - PixiJS Prototype</title>
<style>
  :root {
    color-scheme: dark;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: #17151a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17151a;
    touch-action: none;
  }
  #shell {
    width: 100vw;
    height: 100dvh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 20%, #332b31 0, #17151a 55%, #0d0c0f 100%);
  }
  canvas {
    display: block;
    width: min(100vw, 430px);
    height: min(100dvh, 932px);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 1px #3b3035, 0 20px 70px #000a;
  }
</style>
</head>
<body>
<div id="shell"></div>

<script type="module">
import {
  Application,
  Container,
  Graphics,
  Text,
  Rectangle
} from 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';

const W = 430;
const H = 932;
const TILE_W = 32;
const TILE_H = 16;

const app = new Application();
await app.init({
  width: W,
  height: H,
  background: '#17151a',
  antialias: false,
  resolution: 1,
  autoDensity: false,
  preference: 'webgl'
});
app.canvas.setAttribute('aria-label', 'Pizza City Demo');
document.querySelector('#shell').appendChild(app.canvas);
app.stage.eventMode = 'static';
app.stage.hitArea = new Rectangle(0, 0, W, H);

const world = new Container();
const ui = new Container();
app.stage.addChild(world, ui);

let scene = 'city';
let tickerFns = [];
let furniture = [
  { type: 'oven', x: 1, y: 1, rot: 0 },
  { type: 'table', x: 5, y: 4, rot: 0 },
  { type: 'chair', x: 4, y: 4, rot: 0 },
  { type: 'chair', x: 7, y: 4, rot: 2 }
];

const palette = {
  ink: 0x17151a,
  cream: 0xf3dfaa,
  cream2: 0xd7bd7b,
  rust: 0xb94f37,
  rust2: 0x803528,
  green: 0x668558,
  green2: 0x455d3e,
  road: 0x55535a,
  road2: 0x45434a,
  line: 0xb7ad8f,
  water: 0x5b8691,
  gold: 0xe0b14a,
  white: 0xf8efd5
};

function clearScene() {
  tickerFns = [];
  world.removeChildren().forEach(c => c.destroy({ children: true }));
  ui.removeChildren().forEach(c => c.destroy({ children: true }));
}

function txt(text, x, y, size = 12, color = '#f8efd5', anchor = 0) {
  const t = new Text({
    text,
    style: {
      fontFamily: 'monospace',
      fontSize: size,
      fill: color,
      fontWeight: '700',
      align: 'center'
    }
  });
  t.x = x;
  t.y = y;
  t.anchor.set(anchor);
  return t;
}

function panel(x, y, w, h, fill = 0x2b2529, border = 0x6f5a4d) {
  const g = new Graphics();
  g.roundRect(x, y, w, h, 4).fill(fill).stroke({ color: border, width: 2 });
  return g;
}

function button(label, x, y, w, h, onTap, active = false) {
  const c = new Container();
  c.x = x;
  c.y = y;
  c.eventMode = 'static';
  c.cursor = 'pointer';
  c.hitArea = new Rectangle(0, 0, w, h);

  const bg = new Graphics();
  bg.roundRect(0, 0, w, h, 5)
    .fill(active ? palette.gold : 0x3b3133)
    .stroke({ color: active ? 0xffe083 : 0x80675b, width: 2 });

  const t = txt(label, w / 2, h / 2, 11, active ? '#17151a' : '#f8efd5', 0.5);
  c.addChild(bg, t);
  c.on('pointertap', onTap);
  return c;
}

function iso(x, y, originX, originY) {
  return {
    x: originX + (x - y) * TILE_W / 2,
    y: originY + (x + y) * TILE_H / 2
  };
}

function diamond(cx, cy, fill, stroke = null) {
  const g = new Graphics();
  const pts = [
    cx, cy - TILE_H / 2,
    cx + TILE_W / 2, cy,
    cx, cy + TILE_H / 2,
    cx - TILE_W / 2, cy
  ];
  g.poly(pts).fill(fill);
  if (stroke !== null) g.poly(pts).stroke({ color: stroke, width: 1 });
  return g;
}

function isoBlock(cx, cy, wTiles, dTiles, height, top, left, right) {
  const g = new Graphics();
  const hw = TILE_W / 2;
  const hh = TILE_H / 2;
  const sx = wTiles;
  const sy = dTiles;

  const p0 = { x: cx, y: cy - hh * sx };
  const p1 = { x: cx + hw * sy, y: cy - hh * sx + hh * sy };
  const p2 = { x: cx + hw * (sy - sx), y: cy + hh * (sx + sy) };
  const p3 = { x: cx - hw * sx, y: cy + hh * sx };

  g.poly([p0.x, p0.y-height, p1.x, p1.y-height, p2.x, p2.y-height, p3.x, p3.y-height]).fill(top);
  g.poly([p3.x, p3.y-height, p2.x, p2.y-height, p2.x, p2.y, p3.x, p3.y]).fill(left);
  g.poly([p1.x, p1.y-height, p2.x, p2.y-height, p2.x, p2.y, p1.x, p1.y]).fill(right);
  return g;
}

function hash2(x, y, seed = 12345) {
  let n = (x * 374761393 + y * 668265263 + seed * 1442695041) >>> 0;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

function makeBuilding(cx, cy, x, y, special = false) {
  const c = new Container();
  const r = hash2(x, y);
  const h = 26 + Math.floor(r * 36);
  const tops = [0xb7774d, 0xa49a73, 0x8f765f, 0x7c8d86, 0xaa6c5c];
  const lefts = [0x9a5c41, 0x7d7157, 0x71594b, 0x5d6f6b, 0x8e5149];
  const rights = [0x714235, 0x5c5544, 0x51453e, 0x465754, 0x6e3c39];
  const idx = Math.floor(r * tops.length) % tops.length;

  c.addChild(isoBlock(cx, cy, 1.6, 1.6, h, special ? 0xd06a42 : tops[idx], special ? 0xa54232 : lefts[idx], special ? 0x7e3028 : rights[idx]));

  const windows = new Graphics();
  const floors = Math.max(1, Math.floor(h / 13));
  for (let f = 0; f < floors; f++) {
    windows.rect(cx - 18, cy - h + 11 + f * 12, 5, 4).fill(0xead17e);
    windows.rect(cx + 12, cy - h + 14 + f * 12, 5, 4).fill(0x9bc1ba);
  }
  c.addChild(windows);

  if (special) {
    const sign = new Graphics();
    sign.rect(cx - 24, cy - h - 18, 48, 12).fill(0x3c1c1d).stroke({ color: 0xe7c36a, width: 1 });
    c.addChild(sign);
    c.addChild(txt('PIZZA', cx, cy - h - 12, 9, '#ffe089', 0.5));
  }
  return c;
}

function makeTree(cx, cy, variant = 0) {
  const c = new Container();
  const trunk = new Graphics();
  trunk.rect(cx - 2, cy - 12, 4, 14).fill(0x6e4a33);
  const crown = new Graphics();
  crown.rect(cx - 8, cy - 24, 16, 12).fill(variant ? 0x637a4f : 0x587348);
  crown.rect(cx - 5, cy - 29, 10, 7).fill(variant ? 0x76915e : 0x6e8b55);
  c.addChild(trunk, crown);
  return c;
}

function createHeader(title, subtitle) {
  ui.addChild(panel(10, 12, W - 20, 67, 0x241f23, 0x6b554c));
  ui.addChild(txt(title, 24, 25, 17, '#f3dfaa'));
  ui.addChild(txt(subtitle, 24, 51, 9, '#b9a995'));
  const money = txt('€ 18.420', W - 24, 25, 13, '#e0b14a');
  money.anchor.set(1, 0);
  ui.addChild(money);
}

function showCity() {
  scene = 'city';
  clearScene();
  createHeader('PIZZA CITY', 'ROM · SAMSTAG · 16:42');

  const city = new Container();
  city.sortableChildren = true;
  world.addChild(city);

  const ox = W / 2;
  const oy = 160;
  const N = 18;
  let specialPos = { x: 8, y: 7 };

  for (let s = 0; s < N * 2; s++) {
    for (let x = 0; x < N; x++) {
      const y = s - x;
      if (y < 0 || y >= N) continue;
      const p = iso(x, y, ox, oy);
      const road = x % 5 === 0 || y % 5 === 0;

      const tile = diamond(p.x, p.y, road ? ((x+y)%2 ? palette.road : palette.road2) : 0x716f4f, road ? 0x3f3e44 : 0x5a583f);
      tile.zIndex = p.y;
      city.addChild(tile);

      if (!road) {
        const r = hash2(x, y, 991);
        if (x === specialPos.x && y === specialPos.y) {
          const b = makeBuilding(p.x, p.y + 2, x, y, true);
          b.zIndex = p.y + 80;
          b.eventMode = 'static';
          b.cursor = 'pointer';
          b.on('pointertap', showRestaurant);
          city.addChild(b);
        } else if (r > 0.22) {
          const b = makeBuilding(p.x, p.y + 2, x, y);
          b.zIndex = p.y + 70;
          city.addChild(b);
        } else {
          const tree = makeTree(p.x, p.y, r > 0.11);
          tree.zIndex = p.y + 40;
          city.addChild(tree);
        }
      } else {
        if ((x + y) % 3 === 0) {
          const m = new Graphics();
          m.rect(p.x - 2, p.y - 1, 5, 2).fill(0xc7b98d);
          m.zIndex = p.y + 2;
          city.addChild(m);
        }
      }
    }
  }

  const cars = [];
  const carColors = [0xc94f3f, 0x4f79a8, 0xd0a746, 0x6b8b62, 0xb8b3a1];
  for (let i = 0; i < 8; i++) {
    const car = new Graphics();
    car.rect(-5, -3, 10, 6).fill(carColors[i % carColors.length]);
    car.rect(-2, -5, 5, 3).fill(0xbfd0cb);
    car.zIndex = 500;
    city.addChild(car);
    cars.push({
      g: car,
      axis: i % 2,
      lane: [0,5,10,15][i % 4],
      t: (i * 2.1) % N,
      speed: 0.8 + (i % 3) * 0.25,
      dir: i % 3 === 0 ? -1 : 1
    });
  }

  const people = [];
  const shirtColors = [0xe0b14a, 0xb94f37, 0x668558, 0x5b8691, 0xa77eaa];
  for (let i = 0; i < 26; i++) {
    const person = new Container();
    const body = new Graphics();
    body.rect(-2, -7, 4, 6).fill(shirtColors[i % shirtColors.length]);
    body.rect(-1, -10, 3, 3).fill(0xd2a072);
    const shadow = new Graphics();
    shadow.ellipse(0, 0, 4, 2).fill({ color: 0x000000, alpha: 0.25 });
    person.addChild(shadow, body);
    person.zIndex = 900;
    city.addChild(person);
    people.push({
      g: person,
      axis: i % 2,
      lane: [0,5,10,15][(i + 1) % 4],
      t: (i * 0.77) % N,
      speed: 0.18 + (i % 5) * 0.035,
      dir: i % 4 < 2 ? 1 : -1,
      offset: (i % 2 ? 0.28 : -0.28)
    });
  }

  tickerFns.push((dt) => {
    for (const c of cars) {
      c.t += c.speed * dt * 0.025 * c.dir;
      if (c.t > N - 0.2) c.t = 0.2;
      if (c.t < 0.2) c.t = N - 0.2;
      const x = c.axis === 0 ? c.t : c.lane;
      const y = c.axis === 0 ? c.lane : c.t;
      const p = iso(x, y, ox, oy);
      c.g.x = Math.round(p.x);
      c.g.y = Math.round(p.y - 3);
      c.g.zIndex = p.y + 30;
    }
    for (const p0 of people) {
      p0.t += p0.speed * dt * 0.025 * p0.dir;
      if (p0.t > N - 0.2) p0.t = 0.2;
      if (p0.t < 0.2) p0.t = N - 0.2;
      const x = p0.axis === 0 ? p0.t : p0.lane + p0.offset;
      const y = p0.axis === 0 ? p0.lane + p0.offset : p0.t;
      const p = iso(x, y, ox, oy);
      p0.g.x = Math.round(p.x);
      p0.g.y = Math.round(p.y);
      p0.g.zIndex = p.y + 60;
    }
  });

  ui.addChild(panel(14, H - 190, W - 28, 66, 0x241f23, 0x6b554c));
  ui.addChild(txt('STADT-SIMULATION', 27, H - 176, 11, '#e0b14a'));
  ui.addChild(txt('26 Passanten · 8 Autos · prozedurale Blocks', 27, H - 154, 9, '#c9bca9'));
  ui.addChild(txt('Tippe auf das PIZZA-Gebäude oder nutze den Button.', 27, H - 137, 9, '#8f8378'));

  ui.addChild(button('RESTAURANT BETRETEN', 28, H - 108, W - 56, 50, showRestaurant, true));
  ui.addChild(txt('PIXEL PROTOTYPE · PIXIJS 8', W / 2, H - 34, 9, '#776b65', 0.5));
}

let selectedTool = 'table';
let selectedRot = 0;
const room = { cols: 10, rows: 12, ox: W / 2, oy: 160 };

const itemDefs = {
  table: { w: 2, h: 2, label: 'TISCH' },
  chair: { w: 1, h: 1, label: 'STUHL' },
  oven: { w: 2, h: 1, label: 'OFEN' },
  vending: { w: 1, h: 1, label: 'AUTOMAT' }
};

function dimsFor(item) {
  const d = itemDefs[item.type || item];
  const rot = item.rot ?? selectedRot;
  return rot % 2 ? { w: d.h, h: d.w } : { w: d.w, h: d.h };
}

function occupiedCells(item) {
  const d = dimsFor(item);
  const out = [];
  for (let dx = 0; dx < d.w; dx++) {
    for (let dy = 0; dy < d.h; dy++) out.push(`${item.x + dx},${item.y + dy}`);
  }
  return out;
}

function canPlace(type, x, y, rot) {
  const tmp = { type, x, y, rot };
  const d = dimsFor(tmp);
  if (x < 0 || y < 0 || x + d.w > room.cols || y + d.h > room.rows) return false;
  const occupied = new Set(furniture.flatMap(occupiedCells));
  return occupiedCells(tmp).every(c => !occupied.has(c));
}

function removeAt(x, y) {
  const idx = furniture.findIndex(item => occupiedCells(item).includes(`${x},${y}`));
  if (idx >= 0) furniture.splice(idx, 1);
}

function drawFurnitureItem(item) {
  const base = iso(item.x, item.y, room.ox, room.oy);
  const c = new Container();
  c.zIndex = base.y + 100 + (item.x + item.y);
  const d = dimsFor(item);

  if (item.type === 'table') {
    const center = iso(item.x + (d.w - 1)/2, item.y + (d.h - 1)/2, room.ox, room.oy);
    const top = diamond(center.x, center.y - 9, 0xa96c43, 0x5b3828);
    top.scale.set(1.2, 0.85);
    c.addChild(top);
    const legs = new Graphics();
    legs.rect(center.x - 10, center.y - 5, 3, 10).fill(0x5d3828);
    legs.rect(center.x + 7, center.y - 5, 3, 10).fill(0x5d3828);
    c.addChild(legs);
  }

  if (item.type === 'chair') {
    const center = iso(item.x, item.y, room.ox, room.oy);
    const g = new Graphics();
    g.rect(center.x - 5, center.y - 9, 10, 6).fill(0x8b5a3d);
    g.rect(center.x - 5, center.y - 16, 3, 8).fill(0x5c392b);
    g.rect(center.x + 2, center.y - 16, 3, 8).fill(0x5c392b);
    c.addChild(g);
  }

  if (item.type === 'oven') {
    const center = iso(item.x + (d.w-1)/2, item.y + (d.h-1)/2, room.ox, room.oy);
    c.addChild(isoBlock(center.x, center.y, 1.25, 0.95, 28, 0x8e8b7f, 0x67645f, 0x4d4c4a));
    const face = new Graphics();
    face.rect(center.x + 7, center.y - 17, 12, 10).fill(0x241f23);
    face.rect(center.x + 9, center.y - 15, 8, 5).fill(0xca5b37);
    c.addChild(face);
  }

  if (item.type === 'vending') {
    const center = iso(item.x, item.y, room.ox, room.oy);
    c.addChild(isoBlock(center.x, center.y, 0.7, 0.7, 34, 0x617e8d, 0x46606b, 0x344953));
    const face = new Graphics();
    face.rect(center.x + 4, center.y - 26, 7, 14).fill(0xd6c45c);
    c.addChild(face);
  }

  return c;
}

function showRestaurant() {
  scene = 'restaurant';
  clearScene();
  createHeader('MAMMA MIA', 'EINRICHTUNGSMODUS · FREIE PLATZIERUNG');

  const floorLayer = new Container();
  const itemLayer = new Container();
  itemLayer.sortableChildren = true;
  world.addChild(floorLayer, itemLayer);

  const wall = new Graphics();
  const a = iso(0, 0, room.ox, room.oy);
  const b = iso(room.cols - 1, 0, room.ox, room.oy);
  const c = iso(0, room.rows - 1, room.ox, room.oy);
  wall.poly([a.x, a.y-6, b.x, b.y-6, b.x, b.y-70, a.x, a.y-70]).fill(0x7f684e);
  wall.poly([a.x, a.y-6, c.x, c.y-6, c.x, c.y-70, a.x, a.y-70]).fill(0x675646);
  world.addChildAt(wall, 0);

  for (let s = 0; s < room.cols + room.rows; s++) {
    for (let x = 0; x < room.cols; x++) {
      const y = s - x;
      if (y < 0 || y >= room.rows) continue;
      const p = iso(x, y, room.ox, room.oy);
      const tile = diamond(p.x, p.y, (x+y)%2 ? 0xc2a264 : 0xb58f54, 0x765d3e);
      tile.eventMode = 'static';
      tile.cursor = 'pointer';
      tile.hitArea = new Rectangle(p.x - TILE_W/2, p.y - TILE_H/2, TILE_W, TILE_H);
      tile.on('pointertap', () => {
        if (selectedTool === 'delete') {
          removeAt(x, y);
          showRestaurant();
          return;
        }
        if (canPlace(selectedTool, x, y, selectedRot)) {
          furniture.push({ type: selectedTool, x, y, rot: selectedRot });
          showRestaurant();
        } else {
          flashMessage('HIER IST KEIN PLATZ');
        }
      });
      floorLayer.addChild(tile);
    }
  }

  furniture
    .slice()
    .sort((a, b) => (a.x + a.y) - (b.x + b.y))
    .forEach(item => itemLayer.addChild(drawFurnitureItem(item)));

  const doorP = iso(room.cols - 1, room.rows - 1, room.ox, room.oy);
  const door = new Graphics();
  door.rect(doorP.x - 7, doorP.y - 18, 14, 18).fill(0x6f3e2f);
  world.addChild(door);

  const walkers = [];
  for (let i = 0; i < 5; i++) {
    const actor = new Container();
    const sh = new Graphics();
    sh.ellipse(0, 1, 5, 2).fill({ color: 0x000000, alpha: 0.25 });
    const body = new Graphics();
    body.rect(-2, -8, 4, 7).fill(i === 0 ? 0xffffff : [0xb94f37, 0x668558, 0x5b8691, 0xe0b14a][i-1]);
    body.rect(-1, -11, 3, 3).fill(0xd2a072);
    actor.addChild(sh, body);
    itemLayer.addChild(actor);
    walkers.push({
      g: actor,
      x: 2 + i,
      y: 8 - (i % 3),
      tx: 2 + ((i * 3) % 6),
      ty: 2 + ((i * 5) % 7),
      speed: 0.005 + i * 0.0004
    });
  }

  tickerFns.push((dt) => {
    for (const a0 of walkers) {
      const dx = a0.tx - a0.x;
      const dy = a0.ty - a0.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.08) {
        a0.tx = 1 + Math.floor(Math.random() * 8);
        a0.ty = 1 + Math.floor(Math.random() * 10);
      } else {
        a0.x += (dx / len) * a0.speed * dt * 16;
        a0.y += (dy / len) * a0.speed * dt * 16;
      }
      const p = iso(a0.x, a0.y, room.ox, room.oy);
      a0.g.x = Math.round(p.x);
      a0.g.y = Math.round(p.y - 2);
      a0.g.zIndex = p.y + 180;
    }
  });

  ui.addChild(panel(10, H - 252, W - 20, 192, 0x241f23, 0x6b554c));
  ui.addChild(txt('OBJEKT WÄHLEN', 24, H - 238, 10, '#e0b14a'));

  const tools = [
    ['table', 'TISCH'],
    ['chair', 'STUHL'],
    ['oven', 'OFEN'],
    ['vending', 'AUTOMAT'],
    ['delete', 'LÖSCHEN']
  ];

  tools.forEach((tool, i) => {
    const col = i % 3;
    const row = Math.floor(i / 3);
    ui.addChild(button(
      tool[1],
      22 + col * 130,
      H - 215 + row * 48,
      118,
      38,
      () => { selectedTool = tool[0]; showRestaurant(); },
      selectedTool === tool[0]
    ));
  });

  ui.addChild(button(`DREHEN ${selectedRot * 90}°`, 282, H - 167, 118, 38, () => {
    selectedRot = (selectedRot + 1) % 4;
    showRestaurant();
  }));

  ui.addChild(button('← STADT', 22, H - 112, 110, 38, showCity));
  ui.addChild(txt('Tippe auf ein Bodenfeld zum Platzieren.', 148, H - 101, 9, '#c9bca9'));
  ui.addChild(txt(`${furniture.length} Objekte platziert`, 148, H - 85, 9, '#8f8378'));
}

function flashMessage(message) {
  const c = new Container();
  c.addChild(panel(84, 91, 262, 36, 0x5a2f2c, 0xd78c60));
  c.addChild(txt(message, W/2, 109, 10, '#ffe1a1', 0.5));
  ui.addChild(c);
  setTimeout(() => {
    if (!c.destroyed) {
      ui.removeChild(c);
      c.destroy({ children: true });
    }
  }, 650);
}

app.ticker.add((ticker) => {
  const dt = ticker.deltaTime;
  for (const fn of tickerFns) fn(dt);
});

showCity();
</script>
</body>
</html>
