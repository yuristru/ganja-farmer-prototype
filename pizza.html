<div id="app">
  <div id="loading" class="loading" role="status"><span>PIXEL-ASSETS LADEN...</span></div>
  <div class="ui topbar">
    <div class="topcell datecell"><svg class="calendar" aria-hidden="true"><use href="#icon-calendar"/></svg><div class="datecopy"><div id="gameDate" class="date">Do., 12. Apr. 2001</div><div id="gameTime" class="time">11:30</div></div></div>
    <div class="topcell moneycell"><svg class="cash" aria-hidden="true"><use href="#icon-cash"/></svg><div class="money" aria-label="Kontostand: 243.560 Deutsche Mark">243.560 DM</div></div>
    <div class="topcell"><div class="speed" aria-label="Spieltempo">
      <button type="button" data-speed="0" aria-label="Pause" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>
      <button type="button" data-speed="1" class="active" aria-label="Normales Tempo" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 5 12 7-12 7z"/></svg></button>
      <button type="button" data-speed="3" aria-label="Dreifaches Tempo" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m2 5 10 7-10 7zm10 0 10 7-10 7z"/></svg></button>
      <button type="button" data-speed="6" aria-label="Sechsfaches Tempo" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m1 5 8 7-8 7zm7 0 8 7-8 7zm7 0 8 7-8 7z"/></svg></button>
    </div></div>

  <div id="cityControls" class="ui citycontrols">
    <button type="button" id="zoomInBtn" aria-label="Stadt vergrößern">+</button>
    <button type="button" id="zoomOutBtn" aria-label="Stadt verkleinern">−</button>
    <button type="button" id="centerBtn" aria-label="Zur Stadtmitte" title="Zur Stadtmitte"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
  </div>
  <div id="restaurantHead" class="ui restaurantHead" hidden>
    <svg class="restaurantBadge" aria-hidden="true"><use href="#icon-pizza"/></svg><div class="restaurantName"><strong>Mamma Mia</strong><span>Einrichtungsmodus</span></div><div class="stars" aria-label="Vier von fünf Sternen">★★★★☆</div>
  </div>
  <div id="placementHint" class="ui placementhint" hidden>
    <div class="placementcopy"><strong id="placementTitle">4er-Tisch mit Stühlen · 0°</strong><span id="placementStatus" role="status">Auf das Raster tippen oder ziehen.</span></div>
    <button type="button" id="placeBtn" disabled>Setzen</button>
    <button type="button" id="cancelBtn" aria-label="Platzierung abbrechen" hidden>×</button>
  </div>
  <div id="tools" class="ui tools" hidden>
    <div class="toolrow tables" aria-label="Tische mit enthaltenen Stühlen auswählen">
      <button type="button" class="toolbtn" data-tool="table" data-seats="2" aria-label="Tisch für 2 Personen mit Stühlen" aria-pressed="false"><b aria-hidden="true">2</b>2er-Tisch</button>
      <button type="button" class="toolbtn active" data-tool="table" data-seats="4" aria-label="Tisch für 4 Personen mit Stühlen" aria-pressed="true"><b aria-hidden="true">4</b>4er-Tisch</button>
      <button type="button" class="toolbtn" data-tool="table" data-seats="6" aria-label="Tisch für 6 Personen mit Stühlen" aria-pressed="false"><b aria-hidden="true">6</b>6er-Tisch</button>
      <button type="button" class="toolbtn" data-tool="table" data-seats="8" aria-label="Tisch für 8 Personen mit Stühlen" aria-pressed="false"><b aria-hidden="true">8</b>8er-Tisch</button>
    </div>
    <div class="toolrow extras" aria-label="Weitere Möbel auswählen">
      <button type="button" class="toolbtn" data-tool="oven" aria-pressed="false"><b aria-hidden="true">▣</b>Ofen</button>
      <button type="button" class="toolbtn" data-tool="bar" aria-pressed="false"><b aria-hidden="true">▰</b>Theke</button>
      <button type="button" class="toolbtn" data-tool="plant" aria-pressed="false"><b aria-hidden="true">♣</b>Pflanze</button>
    </div>
    <div class="toolactions">
      <button type="button" id="rotateBtn">Drehen 0°</button>
      <button type="button" id="deleteBtn" aria-pressed="false">Löschen</button>
      <button type="button" id="undoBtn" disabled>Rückgängig</button>
      <button type="button" id="resetBtn">Zurücksetzen</button>

  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <nav class="ui bottomnav" aria-label="Spielbereiche">

    <button type="button" id="restaurantBtn" class="navbtn" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-cutlery"/></svg>Restaurant</button>

    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><svg aria-hidden="true"><use href="#icon-people"/></svg>Personal</button>

    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><svg aria-hidden="true"><use href="#icon-coins"/></svg>Finanzen</button>
  </nav>
  <div id="credit" class="credit" aria-hidden="true">Pizza City</div>
</div>
<noscript>Bitte JavaScript aktivieren, um die Pizza-Demo zu starten.</noscript>
<script type="module">
  import('./pizza.js?v=20261010f').catch(error=>{
    console.error('Pizza demo could not start',error);
    const loading=document.querySelector('#loading');loading.hidden=false;loading.replaceChildren();
    const message=document.createElement('p');message.textContent='Die Demo konnte nicht starten. Bitte erneut laden.';
    const retry=document.createElement('button');retry.type='button';retry.textContent='Erneut laden';retry.onclick=()=>location.reload();
    loading.append(message,retry);
  });
</script>
</body>
</html>
