<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171416">
  <title>Pizza City Prototype</title>
  <link rel="stylesheet" href="pizza.css?v=20261010b">
</head>
<body>
<div id="app">
  <div id="loading" class="loading" role="status"><span>PIXEL-ASSETS LADEN...</span></div>
  <div class="ui topbar">
    <div class="topcell"><div id="gameDate" class="date">Do., 12. Apr. 2001</div><div id="gameTime" class="time">11:30</div></div>
    <div class="topcell"><div class="money"><small>KONTO</small>243.560 DM</div></div>
    <div class="topcell"><div class="speed" aria-label="Spieltempo">
      <button type="button" data-speed="0" aria-label="Pause" aria-pressed="false">Ⅱ</button>
      <button type="button" data-speed="1" class="active" aria-label="Normales Tempo" aria-pressed="true">▶</button>
      <button type="button" data-speed="3" aria-label="Dreifaches Tempo" aria-pressed="false">▶▶</button>
    </div></div>
  </div>
  <div id="cityHint" class="ui cityhint">Stadt ziehen · Mit zwei Fingern zoomen · Mamma Mia öffnen</div>
  <div id="cityControls" class="ui citycontrols">
    <button type="button" id="zoomInBtn" aria-label="Stadt vergrößern">+</button>
    <button type="button" id="zoomOutBtn" aria-label="Stadt verkleinern">−</button>
    <button type="button" id="centerBtn" aria-label="Zur Stadtmitte" title="Zur Stadtmitte"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
  </div>
  <div id="restaurantHead" class="ui restaurantHead" hidden>
    <div><strong>Mamma Mia</strong><span>Restaurant · Einrichtung</span></div><div class="stars" aria-label="Vier von fünf Sternen">★★★★☆</div>
  </div>
  <div id="placementHint" class="ui placementhint" hidden>Tisch: freie Bodenfläche antippen · 0°</div>
  <div id="tools" class="ui tools" hidden>
    <div class="toolrow" aria-label="Möbel auswählen">
      <button type="button" class="toolbtn active" data-tool="table" aria-pressed="true"><b aria-hidden="true">▦</b>Tisch</button>
      <button type="button" class="toolbtn" data-tool="chair" aria-pressed="false"><b aria-hidden="true">▥</b>Stuhl</button>
      <button type="button" class="toolbtn" data-tool="oven" aria-pressed="false"><b aria-hidden="true">▣</b>Ofen</button>
      <button type="button" class="toolbtn" data-tool="bar" aria-pressed="false"><b aria-hidden="true">▰</b>Theke</button>
      <button type="button" class="toolbtn" data-tool="plant" aria-pressed="false"><b aria-hidden="true">♣</b>Pflanze</button>
    </div>
    <div class="toolactions">
      <button type="button" id="rotateBtn">Drehen 0°</button>
      <button type="button" id="deleteBtn" aria-pressed="false">Löschen</button>
      <button type="button" id="undoBtn" disabled>Rückgängig</button>
      <button type="button" id="resetBtn">Zurücksetzen</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <nav class="ui bottomnav" aria-label="Spielbereiche">
    <button type="button" id="cityBtn" class="navbtn active" aria-pressed="true"><b aria-hidden="true">▥</b>Stadt</button>
    <button type="button" id="restaurantBtn" class="navbtn" aria-pressed="false"><b aria-hidden="true">♜</b>Restaurant</button>
    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><b aria-hidden="true">◉</b>Pizza</button>
    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><b aria-hidden="true">♟</b>Personal</button>
    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><b aria-hidden="true">◀</b>Werbung</button>
    <button type="button" class="navbtn" disabled title="In dieser Demo noch nicht verfügbar"><b aria-hidden="true">●</b>Finanzen</button>
  </nav>
  <div id="credit" class="credit">CC0 City: pixel32 · Furniture: Kenney CC0</div>
</div>
<noscript>Bitte JavaScript aktivieren, um die Pizza-Demo zu starten.</noscript>
<script type="module">
  import('./pizza.js?v=20261010b').catch(error=>{
    console.error('Pizza demo could not start',error);
    const loading=document.querySelector('#loading');loading.hidden=false;loading.replaceChildren();
    const message=document.createElement('p');message.textContent='Die Demo konnte nicht starten. Bitte erneut laden.';
    const retry=document.createElement('button');retry.type='button';retry.textContent='Erneut laden';retry.onclick=()=>location.reload();
    loading.append(message,retry);
  });
</script>
</body>
</html>
